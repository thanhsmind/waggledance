[package]
name = "waggledance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "waggledance"
path = "src/main.rs"

[dependencies]
waggledance-core = { path = "../waggledance-core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
time.workspace = true
tokio.workspace = true
clap.workspace = true
async-trait.workspace = true
interprocess.workspace = true
rand.workspace = true

# Telegram notification transport (agent-terminal-17, D1/D7): rustls instead
# of native TLS keeps the build self-contained (no system OpenSSL). Serde's
# json feature is already pulled in via serde_json above; requested again
# here so reqwest's own JSON body helper builds without a second dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# setsid(2) for fully detaching the auto-spawned daemon (Unix only).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
