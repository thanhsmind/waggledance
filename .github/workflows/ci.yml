name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Parse install.ps1
        # The installer is rewritten by hand and pwsh is absent on the dev
        # machine; a parse failure here is the only syntax check it gets.
        shell: pwsh
        run: |
          $src = Get-Content -Raw -Path install.ps1
          $null = [ScriptBlock]::Create($src)
          Write-Host "install.ps1 parsed OK"

      - name: Test
        run: cargo test --workspace
