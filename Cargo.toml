[workspace]
resolver = "2"
members = ["crates/waggledance-core", "crates/waggledance"]

[workspace.package]
version = "0.5.5"
edition = "2021"
license = "MIT"
authors = ["Van Tran"]
repository = "https://github.com/thanhsmind/waggledance"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# runtime / cli
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
interprocess = { version = "2.4.2", features = ["tokio"] }
rand = "0.8"

# platform
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
 incremental = false # Tắt incremental trong release để không tạo 1.4GB cache

# Local dev loop. `release` stays tuned for the shipped binary (fat LTO,
# codegen-units = 1) — both of which force the final codegen onto a single
# thread and pin one core for minutes. `fast` trades binary size and a little
# runtime speed for a build that actually uses every core.
# Build with: cargo build --profile fast -p waggledance  (binary at target/fast/)
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "debuginfo"

# `cargo test` and plain `cargo build` use `dev`. Full debuginfo on every
# dependency made target/debug the heaviest tree (4.8 GB, 2.2 GB of it
# incremental). Keep line tables for our own crates so backtraces still name
# file:line, and drop debuginfo from dependencies entirely.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

